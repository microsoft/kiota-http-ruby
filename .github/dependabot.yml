version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: daily
  open-pull-requests-limit: 10
  groups:
    codeql-github-actions:
      patterns:
        - "github/codeql-action/*"
  cooldown:
    default-days: 7
- package-ecosystem: bundler
  directory: /
  schedule:
    interval: daily
  open-pull-requests-limit: 10
  cooldown:
    default-days: 7
